# Cổng web: TLS 1.2+, chuyển /api và /auth tới API, KHÔNG đệm luồng SSE, /metrics giữ nội bộ.
# Chứng chỉ gắn ngoài: /etc/nginx/certs/tls.crt và tls.key.

server {
    listen 80;
    server_name _;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Mỗi yêu cầu một tệp ≤ 50 MB (+ phần đệm multipart)
    client_max_body_size 55m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Referrer-Policy "same-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # Chỉ mạng nội bộ (Prometheus lấy trực tiếp từ api:8000/metrics)
    location = /metrics { return 404; }

    # SSE: trạng thái tài liệu (API-04)
    location = /api/v1/documents/events {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # SSE: câu trả lời (API-08)
    location ~ ^/api/v1/chat/sessions/[^/]+/messages$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location ~ ^/(api|auth)/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        proxy_pass http://api:8000;
    }

    # Giao diện một trang: mọi đường dẫn khác về index.html
    location / {
        try_files $uri /index.html;
    }
}
