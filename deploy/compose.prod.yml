# Triển khai tại chỗ (AD-11): web (nginx) + api + worker + db.
# Dùng: sao chép .env.template thành .env (quyền 0600), điền giá trị, đặt chứng chỉ ở ./certs, rồi
#   docker compose -f deploy/compose.prod.yml --env-file deploy/.env up -d --build
# CSDL ngoài: bỏ dịch vụ `db` và đặt CWD_DATABASE_URL trỏ tới máy chủ đó.

x-backend: &backend
  build:
    context: ..
    dockerfile: deploy/Dockerfile.backend
  image: cwd-backend:local
  env_file: .env
  restart: always
  volumes:
    - cwd_storage:/srv/storage

services:
  db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cwd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cwd}
    volumes:
      - cwd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cwd} -d ${POSTGRES_DB:-cwd}"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}

  api:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9101/metrics', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5
    depends_on:
      migrate: {condition: service_completed_successfully}

  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    image: cwd-web:local
    restart: always
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    volumes:
      - ${CERTS_DIR:-./certs}:/etc/nginx/certs:ro
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5

volumes:
  cwd_pgdata:
  cwd_storage:
