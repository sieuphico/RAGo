name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cwd
          POSTGRES_PASSWORD: cwd
          POSTGRES_DB: cwd
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cwd -d cwd"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CWD_COVERAGE_MIN: "0"  # đặt 70 khi chuẩn bị G7 (T-612)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Font tiếng Việt cho PDF mẫu
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core
      - run: ci/run_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
