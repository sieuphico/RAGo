name: ci
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ci/run_ci.sh
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.xml
