name: ci
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cwd
          POSTGRES_PASSWORD: cwd
          POSTGRES_DB: cwd
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cwd -d cwd"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ci/run_ci.sh
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
